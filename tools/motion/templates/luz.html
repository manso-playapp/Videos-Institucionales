<!doctype html>
<html><head><meta charset="utf-8">
<!--
  LUZ — light leak / destello orgánico generado (manchas de luz cálidas que derivan).
  Se superpone con modo "screen" (render_edl: "blend":"screen"). Fondo negro, sin alfa.
  params: {"dur":3,"semilla":7,"paleta":["#ff8a3d","#ffd28a","#ff4d6d"],"intensidad":0.9,
           "forma":"leak"|"flare"}
-->
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{position:absolute;inset:0}</style></head>
<body data-bg="#000"><canvas id="c"></canvas>
<script src="_base.js"></script>
<script>
window.MOTION = {
  async setup(p, env) {
    setupStage(env);
    const c = document.getElementById('c'); c.width = env.width; c.height = env.height;
    this.ctx = c.getContext('2d'); this.W = env.width; this.H = env.height; this.p = p;
    let s = p.semilla ?? 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const pal = p.paleta || ['#ff8a3d', '#ffd28a', '#ff4d6d', '#ffb347'];
    this.blobs = Array.from({ length: p.forma === 'flare' ? 3 : 6 }, (_, i) => ({
      x: rnd(), y: rnd(), r: .25 + rnd() * .55, vx: (rnd() - .5) * .25, vy: (rnd() - .5) * .15,
      c: pal[i % pal.length], ph: rnd() * 6.28, sp: .6 + rnd()
    }));
    this.dur = +(p.dur || 3);
    return this.dur;
  },
  async seek(t) {
    const { ctx, W, H, p } = this, u = t / this.dur;
    const env = Math.sin(Math.PI * Math.min(1, Math.max(0, u))) ** 1.5 * (p.intensidad ?? .9);
    ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const b of this.blobs) {
      const x = (b.x + b.vx * t) * W, y = (b.y + b.vy * t) * H, r = b.r * Math.max(W, H) * (1 + .15 * Math.sin(b.ph + t * b.sp));
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      const a = env * (.55 + .45 * Math.sin(b.ph + t * b.sp * 1.7));
      g.addColorStop(0, b.c + Math.round(Math.max(0, Math.min(1, a)) * 255).toString(16).padStart(2, '0'));
      g.addColorStop(1, b.c + '00');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    if (p.forma === 'flare') {   // franja anamórfica horizontal
      const y = H * (.45 + .1 * Math.sin(t)); const g = ctx.createLinearGradient(0, y - H * .02, 0, y + H * .02);
      g.addColorStop(0, '#0000'); g.addColorStop(.5, `rgba(255,190,140,${env * .5})`); g.addColorStop(1, '#0000');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }
};
</script></body></html>
